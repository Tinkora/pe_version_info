name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Protected v-prefixed SemVer tag to publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  validate:
    name: Validate protected release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject untrusted source ref
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_REF}" != "refs/tags/${RELEASE_TAG}" ]]; then
            echo "releases must run from the matching version tag" >&2
            exit 1
          fi
          if [[ "${RELEASE_REF_PROTECTED}" != "true" ]]; then
            echo "release tags must be protected by repository rules" >&2
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Match candidate version to the workspace
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: python scripts/validate_release_version.py "$RELEASE_TAG"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target "${{ matrix.target }}"
      - name: Build locked release binary
        run: cargo +1.95.0 build --release --locked --target ${{ matrix.target }} -p pevi_cli
      - name: Package and checksum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          mkdir -p dist
          package_root="$(mktemp -d)"
          verification_root="$(mktemp -d)"
          trap 'rm -rf -- "${package_root}" "${verification_root}"' EXIT
          artifact="dist/pevi-${RELEASE_TAG}-${{ matrix.target }}.tar.gz"
          install -m 0755 "target/${{ matrix.target }}/release/pevi" "${package_root}/pevi"
          tar -C "${package_root}" -czf "$artifact" pevi
          tar -C "${verification_root}" -xzf "$artifact"
          test -x "${verification_root}/pevi"
          (cd dist && shasum -a 256 "$(basename "$artifact")" > "$(basename "$artifact").sha256")
      - name: Package and checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $artifact = "dist/pevi-$env:RELEASE_TAG-${{ matrix.target }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/pevi.exe" $artifact
          $checksum = (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLower() + "  $(Split-Path $artifact -Leaf)"
          [System.IO.File]::WriteAllText(
            "$artifact.sha256",
            "$checksum`n",
            [System.Text.Encoding]::ASCII
          )
      - name: Upload candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pevi-${{ env.RELEASE_TAG }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
  evidence:
    name: Aggregate and attest release evidence
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Download candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pevi-${{ env.RELEASE_TAG }}-*
          path: dist
          merge-multiple: true

      - name: Generate aggregate checksums, SBOM, and license evidence
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          for target in \
            x86_64-unknown-linux-gnu \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc
          do
            cargo +1.95.0 metadata \
              --format-version 1 \
              --locked \
              --filter-platform "$target" \
              > "artifacts.cargo-metadata-${target}.json"
          done
          python scripts/generate_release_evidence.py \
            --dist dist \
            --root-package pevi_cli \
            --metadata x86_64-unknown-linux-gnu=artifacts.cargo-metadata-x86_64-unknown-linux-gnu.json \
            --metadata aarch64-apple-darwin=artifacts.cargo-metadata-aarch64-apple-darwin.json \
            --metadata x86_64-pc-windows-msvc=artifacts.cargo-metadata-x86_64-pc-windows-msvc.json \
            --repository "${GITHUB_REPOSITORY}" \
            --version "${RELEASE_TAG#v}" \
            --revision "${GITHUB_SHA}" \
            --created "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/sbom.spdx.json

      - name: Upload aggregate release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pevi-${{ env.RELEASE_TAG }}-release-evidence
          path: |
            dist/SHA256SUMS
            dist/THIRD_PARTY_NOTICES.md
            dist/license_inventory.json
            dist/sbom.spdx.json
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: evidence
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download build and evidence artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pevi-${{ env.RELEASE_TAG }}-*
          path: release-assets
          merge-multiple: true

      - name: Verify release assets and tag binding
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" == "${GITHUB_SHA}" ]] || {
            echo "release tag changed during the workflow" >&2
            exit 1
          }
          (cd release-assets && sha256sum --check --strict -- ./*.sha256)
          (cd release-assets && sha256sum --check --strict SHA256SUMS)
          [[ "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" == "10" ]] || {
            echo "expected three target binaries or archives, three per-asset checksums, and four release evidence files" >&2
            exit 1
          }

      - name: Create or reuse GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(
            find release-assets -maxdepth 1 -type f -print0 | LC_ALL=C sort -z
          )
          {
            cat CHANGELOG.md
            printf '\n中文说明：请参阅 [中文 README](https://github.com/%s/blob/%s/README.zh-CN.md) 和 [中文发布流程](https://github.com/%s/blob/%s/docs/RELEASING.zh-CN.md)。\n' \
              "${GH_REPO}" "${RELEASE_TAG}" "${GH_REPO}" "${RELEASE_TAG}"
          } > "${RUNNER_TEMP}/release-notes.md"

          releases_json="$(gh api --paginate --slurp \
            "repos/${GH_REPO}/releases?per_page=100")"
          matching_releases="$(jq -c --arg tag "${RELEASE_TAG}" \
            '[.[][] | select(.tag_name == $tag)]' <<<"${releases_json}")"
          match_count="$(jq -r 'length' <<<"${matching_releases}")"
          if ((match_count > 1)); then
            echo "multiple releases use ${RELEASE_TAG}" >&2
            exit 1
          fi

          release_id=""
          if ((match_count == 1)); then
            release_json="$(jq -c '.[0]' <<<"${matching_releases}")"
            release_id="$(jq -er '.id' <<<"${release_json}")"
            if jq -e '.draft == true' <<<"${release_json}" >/dev/null; then
              echo "Replacing interrupted draft ${release_id} for ${RELEASE_TAG}."
              gh api --method DELETE "repos/${GH_REPO}/releases/${release_id}"
              release_id=""
            else
              echo "Reusing published release ${release_id} for ${RELEASE_TAG}."
            fi
          fi

          if [[ -z "${release_id}" ]]; then
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --repo "${GH_REPO}" \
              --verify-tag \
              --target "${GITHUB_SHA}" \
              --title "PE Version Info ${RELEASE_TAG}" \
              --notes-file "${RUNNER_TEMP}/release-notes.md" \
              --draft \
              --prerelease >/dev/null
            releases_json="$(gh api --paginate --slurp \
              "repos/${GH_REPO}/releases?per_page=100")"
            matching_releases="$(jq -c --arg tag "${RELEASE_TAG}" \
              '[.[][] | select(.tag_name == $tag and .draft == true)]' \
              <<<"${releases_json}")"
            if [[ "$(jq -r 'length' <<<"${matching_releases}")" != "1" ]]; then
              echo "new draft release cannot be resolved uniquely" >&2
              exit 1
            fi
            release_id="$(jq -er '.[0].id' <<<"${matching_releases}")"
          fi
          echo "release_id=${release_id}" >> "${GITHUB_OUTPUT}"

      - name: Verify remote release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(
            find release-assets -maxdepth 1 -type f -print0 | LC_ALL=C sort -z
          )
          release_json="$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}")"
          jq -e --arg tag "${RELEASE_TAG}" \
            '.tag_name == $tag and .prerelease == true' \
            <<<"${release_json}" >/dev/null
          expected_names="$(printf '%s\n' "${assets[@]}" | sed 's|.*/||' | LC_ALL=C sort)"
          remote_names="$(jq -r '.assets[].name' <<<"${release_json}" | LC_ALL=C sort)"
          if [[ "${remote_names}" != "${expected_names}" ]]; then
            echo "Remote release asset inventory is not exact." >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            asset_name="$(basename "${asset}")"
            local_digest="sha256:$(sha256sum -- "${asset}" | cut -d ' ' -f 1)"
            remote_digest="$(jq -r --arg name "${asset_name}" \
              '.assets[] | select(.name == $name) | .digest // empty' \
              <<<"${release_json}")"
            if [[ "${remote_digest}" != "${local_digest}" ]]; then
              echo "Remote release asset digest does not match ${asset_name}." >&2
              exit 1
            fi
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}")"
          if jq -e '.draft == true' <<<"${release_json}" >/dev/null; then
            gh api --method PATCH "repos/${GH_REPO}/releases/${RELEASE_ID}" \
              -F draft=false \
              -F prerelease=true \
              --jq '.draft' | grep -qx false
          else
            jq -e '.draft == false and .prerelease == true' \
              <<<"${release_json}" >/dev/null
          fi

      - name: Remove failed release draft
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.create_release.outputs.release_id }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        shell: bash
        run: |
          set -uo pipefail
          [[ "${RELEASE_ID}" =~ ^[0-9]+$ ]] || exit 0
          release_json="$(gh api \
            "repos/${GH_REPO}/releases/${RELEASE_ID}" 2>/dev/null)" || exit 0
          if jq -e --arg tag "${RELEASE_TAG}" \
            '.draft == true and .tag_name == $tag' \
            <<<"${release_json}" >/dev/null; then
            gh api --method DELETE "repos/${GH_REPO}/releases/${RELEASE_ID}"
          fi
