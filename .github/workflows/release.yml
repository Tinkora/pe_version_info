name: Release candidate build

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer candidate version
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    name: Validate candidate version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Match candidate version to the workspace
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/validate_release_version.py "$RELEASE_VERSION"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target "${{ matrix.target }}"
      - name: Build locked release binary
        run: cargo +1.95.0 build --release --locked --target ${{ matrix.target }} -p pevi_cli
      - name: Package and checksum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          artifact="dist/pevi-${RELEASE_VERSION}-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/pevi" "$artifact"
          shasum -a 256 "$artifact" > "${artifact}.sha256"
      - name: Package and checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $artifact = "dist/pevi-$env:RELEASE_VERSION-${{ matrix.target }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/pevi.exe" $artifact
          (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLower() + "  $(Split-Path $artifact -Leaf)" | Out-File -Encoding ascii "$artifact.sha256"
      - name: Upload candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pevi-${{ inputs.version }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
  evidence:
    name: Aggregate and attest release evidence
    needs: build
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Download candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pevi-${{ inputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Generate aggregate checksums, SBOM, and license evidence
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          cargo +1.95.0 metadata --format-version 1 --locked > artifacts.cargo-metadata.json
          python scripts/generate_release_evidence.py \
            --dist dist \
            --metadata artifacts.cargo-metadata.json \
            --repository "${GITHUB_REPOSITORY}" \
            --version "${RELEASE_VERSION}" \
            --revision "${GITHUB_SHA}" \
            --created "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/sbom.spdx.json

      - name: Upload aggregate release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pevi-${{ inputs.version }}-release-evidence
          path: |
            dist/SHA256SUMS
            dist/THIRD_PARTY_NOTICES.md
            dist/license_inventory.json
            dist/sbom.spdx.json
          if-no-files-found: error
