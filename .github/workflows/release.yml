name: Release candidate build

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer candidate version
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    name: Validate candidate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject untrusted source ref
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_PROTECTED: ${{ github.ref_protected }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_REF}" == "refs/heads/main" ]]; then
            exit 0
          fi
          if [[ "${RELEASE_REF}" != "refs/tags/${RELEASE_VERSION}" ]]; then
            echo "release candidates must run from main or the matching version tag" >&2
            exit 1
          fi
          if [[ "${RELEASE_REF_PROTECTED}" != "true" ]]; then
            echo "release candidate tags must be protected by repository rules" >&2
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Match candidate version to the workspace
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python scripts/validate_release_version.py "$RELEASE_VERSION"

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --target "${{ matrix.target }}"
      - name: Build locked release binary
        run: cargo +1.95.0 build --release --locked --target ${{ matrix.target }} -p pevi_cli
      - name: Package and checksum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          package_root="$(mktemp -d)"
          verification_root="$(mktemp -d)"
          trap 'rm -rf -- "${package_root}" "${verification_root}"' EXIT
          artifact="dist/pevi-${RELEASE_VERSION}-${{ matrix.target }}.tar.gz"
          install -m 0755 "target/${{ matrix.target }}/release/pevi" "${package_root}/pevi"
          tar -C "${package_root}" -czf "$artifact" pevi
          tar -C "${verification_root}" -xzf "$artifact"
          test -x "${verification_root}/pevi"
          shasum -a 256 "$artifact" > "${artifact}.sha256"
      - name: Package and checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $artifact = "dist/pevi-$env:RELEASE_VERSION-${{ matrix.target }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/pevi.exe" $artifact
          (Get-FileHash $artifact -Algorithm SHA256).Hash.ToLower() + "  $(Split-Path $artifact -Leaf)" | Out-File -Encoding ascii "$artifact.sha256"
      - name: Upload candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pevi-${{ inputs.version }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
  evidence:
    name: Aggregate and attest release evidence
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Download candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pevi-${{ inputs.version }}-*
          path: dist
          merge-multiple: true

      - name: Generate aggregate checksums, SBOM, and license evidence
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          for target in \
            x86_64-unknown-linux-gnu \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc
          do
            cargo +1.95.0 metadata \
              --format-version 1 \
              --locked \
              --filter-platform "$target" \
              > "artifacts.cargo-metadata-${target}.json"
          done
          python scripts/generate_release_evidence.py \
            --dist dist \
            --root-package pevi_cli \
            --metadata x86_64-unknown-linux-gnu=artifacts.cargo-metadata-x86_64-unknown-linux-gnu.json \
            --metadata aarch64-apple-darwin=artifacts.cargo-metadata-aarch64-apple-darwin.json \
            --metadata x86_64-pc-windows-msvc=artifacts.cargo-metadata-x86_64-pc-windows-msvc.json \
            --repository "${GITHUB_REPOSITORY}" \
            --version "${RELEASE_VERSION}" \
            --revision "${GITHUB_SHA}" \
            --created "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.0.0
        with:
          subject-checksums: dist/SHA256SUMS
          sbom-path: dist/sbom.spdx.json

      - name: Upload aggregate release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pevi-${{ inputs.version }}-release-evidence
          path: |
            dist/SHA256SUMS
            dist/THIRD_PARTY_NOTICES.md
            dist/license_inventory.json
            dist/sbom.spdx.json
          if-no-files-found: error
